# MongoDB
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Weather API
weather.api.key=${WEATHER_API_KEY}
weather.api.url=https://api.weatherapi.com/v1/current.json

# ElevenLabs
elevenlabs.api.key=${ELEVENLABS_API_KEY}
elevenlabs.api.url=https://api.elevenlabs.io/v1/text-to-speech
elevenlabs.voice.id=${ELEVENLABS_VOICE_ID}


# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/interactions
gemini.model=${GEMINI_MODEL}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}


# kafka


# Bootstrap Servers Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVER}

# Producer Serialization Configurations
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer Configurations
spring.kafka.consumer.group-id=weekly-sentiment-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Trusted Packages for JSON Deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.princegcs.JournalApplication.model

# Confluent Cloud Security Configuration (SASL_SSL)
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";

# Session Timeout Configuration
spring.kafka.properties.session.timeout.ms=45000


