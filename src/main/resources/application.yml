# Note: Both application.properties and application.yml are included for learning.
# Use either one based on your preference.

spring:
  data:
    mongodb:
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mongodb:
    uri: ${MONGODB_URI}


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


weather:
  api:
    key: ${WEATHER_API_KEY}
    url: https://api.weatherapi.com/v1/current.json

elevenlabs:
  api:
    key: ${ELEVENLABS_API_KEY}
    url: https://api.elevenlabs.io/v1/text-to-speech
  voice:
    id: ${ELEVENLABS_VOICE_ID}

gemini:
  api:
    key: ${GEMINI_API_KEY}
    url: https://generativelanguage.googleapis.com/v1beta/interactions
  model: ${GEMINI_MODEL}

